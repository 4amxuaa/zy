<!-- templates/result.html -->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>充值结果</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .card {
            background: rgba(255, 255, 255, 0.98);
            border-radius: 20px;
            padding: 40px 32px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
            text-align: center;
            max-width: 420px;
            width: 100%;
            position: relative;
            overflow: hidden;
            transition: all 0.3s;
        }
        .card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 5px;
            transition: background 0.3s;
        }
        .card.paid::before { background: linear-gradient(90deg, #52c41a, #95de64); }
        .card.pending::before { background: linear-gradient(90deg, #faad14, #ffd666); }
        .card.closed::before { background: linear-gradient(90deg, #ff4d4f, #ff7875); }

        .icon-wrap {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            margin: 0 auto 20px;
            transition: all 0.3s;
        }
        .paid .icon-wrap { background: #f0fff0; box-shadow: 0 8px 24px rgba(82, 196, 26, 0.3); }
        .pending .icon-wrap { background: #fffbf0; box-shadow: 0 8px 24px rgba(250, 173, 20, 0.3); }
        .closed .icon-wrap { background: #fff1f0; box-shadow: 0 8px 24px rgba(255, 77, 79, 0.3); }

        .title { font-size: 22px; font-weight: 700; margin-bottom: 8px; }
        .paid .title { color: #52c41a; }
        .pending .title { color: #faad14; }
        .closed .title { color: #ff4d4f; }

        .subtitle { color: #888; font-size: 14px; margin-bottom: 24px; }

        .order-box {
            background: #f8f9ff;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 24px;
            text-align: left;
        }
        .order-box .row {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            padding: 6px 0;
        }
        .order-box .row .label { color: #999; }
        .order-box .row .value { color: #333; font-weight: 500; word-break: break-all; text-align: right; max-width: 60%; }

        button {
            background: linear-gradient(135deg, #1677ff, #0958d9);
            color: #fff;
            border: none;
            padding: 12px 32px;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.25s;
            box-shadow: 0 6px 16px rgba(22, 119, 255, 0.3);
        }
        button:hover { transform: translateY(-2px); box-shadow: 0 10px 24px rgba(22, 119, 255, 0.4); }
        button:disabled { background: #ccc; box-shadow: none; cursor: not-allowed; transform: none; }

        .retry-info { color: #aaa; font-size: 12px; margin-top: 14px; min-height: 16px; }

        .spinner {
            display: inline-block;
            width: 14px; height: 14px;
            border: 2px solid #faad14;
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            vertical-align: middle;
            margin-right: 6px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="card pending" id="card">
        <div class="icon-wrap" id="iconWrap">⏳</div>
        <div class="title" id="title">等待支付结果</div>
        <div class="subtitle" id="subtitle">正在确认您的充值状态…</div>

        <div class="order-box">
            <div class="row">
                <span class="label">订单号</span>
                <span class="value">{{ out_trade_no }}</span>
            </div>
            <div class="row">
                <span class="label">充值类型</span>
                <span class="value">SVIP 会员</span>
            </div>
            <div class="row">
                <span class="label">金额</span>
                <span class="value">¥ 0.01</span>
            </div>
        </div>

        <button id="refreshBtn" onclick="manualRefresh()">手动刷新</button>
        <div class="retry-info" id="retryInfo"></div>
    </div>

    <script>
        const OUT_TRADE_NO = "{{ out_trade_no }}";
        const RETRY_DELAYS = [3000, 5000, 10000, 20000, 30000];
        let retryCount = 0;
        let polling = true;

        const card = document.getElementById('card');
        const iconWrap = document.getElementById('iconWrap');
        const title = document.getElementById('title');
        const subtitle = document.getElementById('subtitle');
        const retryInfo = document.getElementById('retryInfo');
        const refreshBtn = document.getElementById('refreshBtn');

        // 三种状态对应的 UI 配置
        const UI = {
            paid:    { cls: 'paid',    icon: '✅', title: '充值成功', subtitle: 'SVIP 会员已开通，感谢您的支持！' },
            pending: { cls: 'pending', icon: '⏳', title: '等待支付结果', subtitle: '正在确认您的充值状态…' },
            closed:  { cls: 'closed',  icon: '❌', title: '订单已关闭', subtitle: '本次充值未完成，请重新下单。' }
        };

        function render(status) {
            const cfg = UI[status] || UI.pending;
            card.className = 'card ' + cfg.cls;
            iconWrap.textContent = cfg.icon;
            title.textContent = cfg.title;
            subtitle.textContent = cfg.subtitle;
        }

        async function query() {
            try {
                const res = await fetch('/pay/query/' + encodeURIComponent(OUT_TRADE_NO));
                const data = await res.json();
                return data.status;
            } catch (e) {
                return 'pending';
            }
        }

        async function poll() {
            if (!polling) return;
            const status = await query();
            render(status);

            if (status === 'paid' || status === 'closed') {
                polling = false;
                retryInfo.textContent = '';
                refreshBtn.disabled = false;
                return;
            }

            if (retryCount < RETRY_DELAYS.length) {
                const delay = RETRY_DELAYS[retryCount];
                retryInfo.innerHTML = '<span class="spinner"></span>第 ' + (retryCount + 1) +
                    ' 次重试将在 ' + (delay / 1000) + ' 秒后进行…';
                retryCount++;
                setTimeout(poll, delay);
            } else {
                polling = false;
                retryInfo.textContent = '自动查询已结束，请手动刷新。';
                refreshBtn.disabled = false;
            }
        }

        async function manualRefresh() {
            refreshBtn.disabled = true;
            retryInfo.textContent = '正在查询…';
            const status = await query();
            render(status);

            if (status === 'paid' || status === 'closed') {
                polling = false;
                retryInfo.textContent = '';
            } else {
                retryInfo.textContent = '仍未支付，可稍后再次刷新。';
            }
            refreshBtn.disabled = false;
        }

        // 页面加载后立即查询并按间隔重试
        refreshBtn.disabled = true;
        poll();
    </script>
</body>
</html>
