
; ============================================================
; 资源付费下载平台 - 完整配置文件
; 修改后重启程序即可生效，无需重新编译
; ============================================================

; ---------- Flask 基础配置 ----------
[flask]
; Flask 会话密钥（生产环境务必改成随机字符串）
secret_key = change-me-to-a-random-string
; 监听地址：0.0.0.0 表示允许外部访问，127.0.0.1 只允许本机
host = 0.0.0.0
; 监听端口
port = 5179
; 是否开启调试模式（生产环境请设为 false）
debug = false
; 项目对外访问的基础 URL（用于拼接回调/返回地址）
base_url = http://127.0.0.1:5179
; 允许跨域的前端地址，多个用英文逗号分隔
cors_origins = http://127.0.0.1:5179,http://localhost:5179

; ---------- 数据库配置 ----------
[database]
; 业务库（商品、订单、下载日志）
url = sqlite:///database/shop.db
; 认证库（用户、OAuth 绑定），与业务库分离
auth_db = database/auth.db

; ---------- 业务参数 ----------
[business]
; 商品默认价格（元）
default_price = 189.90
; 订单默认最大下载次数
default_max_downloads = 3
; 订单默认有效期（小时）
default_expire_hours = 24
; 管理员用户名（登录接口 /api/auth/login 使用）
admin_username = 123
; 管理员密码（首次启动自动创建该账号）
admin_password = 123

; ---------- AuthManager 认证模块 ----------
[auth]
; JWT 签名密钥（生产环境务必改成随机字符串）
jwt_secret = change-me-jwt-secret
; JWT 有效期（天）
jwt_expire_days = 7
; 认证路由统一前缀
url_prefix = /api/auth
; 是否启用图形验证码
enable_captcha = true
; 是否启用账号密码登录
enable_password_login = true
; 是否启用短信验证码登录
enable_sms_login = true
; 是否启用第三方 OAuth 登录
enable_oauth = true
; OAuth 是否使用 Mock Provider（true 时无需真实对接即可跑通）
oauth_mock = true
; 是否信任 X-Forwarded-For 头（部署在 Nginx 后面时设为 true）
trust_proxy = true
; 流控总开关
rate_limit_enabled = true

; ---------- AuthManager 流控阈值 ----------
[auth.rate_limit]
; 登录接口：每 IP 每分钟最多 10 次
login_limit = 10
login_window = 60
; 注册接口：每 IP 每小时最多 5 次
register_limit = 5
register_window = 3600

; ---------- 支付宝配置 ----------
[alipay]
; 应用 AppID（留空表示未配置，下单时会失败）
appid =9021000125694535
; 应用私钥（单行 base64，或带 PEM 标记的多行；支持 \n 转义）
private_key 
; 支付宝公钥
public_key 
; 异步通知地址（留空则自动使用 base_url + /api/payment/alipay/notify）
notify_url =
; 签名类型：RSA2 或 RSA
sign_type = RSA2
; 是否使用沙箱环境
debug = true

; ---------- 微信支付配置 ----------
[wechat]
; 公众号/小程序 AppID
appid =
; 商户号
mch_id =
; 商户 API 私钥
private_key =
; API 证书序列号
serial_no =
; 异步通知地址（留空则自动使用 base_url + /api/payment/wechat/notify）
notify_url =
; 是否使用沙箱环境
debug = false
